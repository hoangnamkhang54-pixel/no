name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git perl make clang lzma libgit2-dev curl unzip

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup Theos Toolchain (Direct Download)
        run: |
          mkdir -p $HOME/theos/toolchain/linux
          curl -LO https://github.com/theos/toolchain-linux/archive/refs/heads/master.zip
          unzip master.zip
          mv toolchain-linux-master/* $HOME/theos/toolchain/linux/
          rm -rf toolchain-linux-master master.zip

      - name: Setup iOS SDK (Direct Download)
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p $HOME/theos/sdks
          mv sdks-master/* $HOME/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
