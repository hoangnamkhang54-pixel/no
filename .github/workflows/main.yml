name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git perl make clang lzma libgit2-dev curl unzip

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Theos Toolchain (Linux-to-iOS)
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks || true
          # Sử dụng mirror công khai của toolchain linux-to-ios
          git clone --depth=1 https://github.com/FindTheLight1023/theos-toolchain-linux.git $HOME/theos/toolchain/linux || \
          git clone --depth=1 https://github.com/theos/toolchain-linux.git $HOME/theos/toolchain/linux || true

      - name: Setup iOS SDK
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/* $HOME/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
