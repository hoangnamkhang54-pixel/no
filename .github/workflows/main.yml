name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git perl make clang lzma libgit2-dev curl unzip

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup Toolchain & SDK
        run: |
          # Tải Toolchain Linux-to-iOS chuẩn
          mkdir -p $HOME/theos/toolchain/linux/iphone
          curl -LO https://github.com/kabiroberai/theos-toolchain-linux/releases/download/v1.0.0/toolchain-linux-arm64.tar.gz
          tar -xzf toolchain-linux-arm64.tar.gz -C $HOME/theos/toolchain/linux/iphone
          rm toolchain-linux-arm64.tar.gz

          # Tải iOS SDK
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
